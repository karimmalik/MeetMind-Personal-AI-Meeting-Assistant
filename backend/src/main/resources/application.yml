server:
  address: 127.0.0.1
  # Port 8080 is reserved on this Windows environment; use a dedicated local port.
  port: 8081
spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: http://127.0.0.1:5173,http://localhost:5173
        allowed-methods: GET
  endpoint:
    health:
      show-details: never
